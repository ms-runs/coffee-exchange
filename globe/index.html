<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee exchange globe</title>
<style>
  :root{
    --blue:#0000FF; --ink:#14171F; --ink-2:#4E5566; --rule:#C9CED8; --bg:#FFFFFF;
    --font:"Helvetica Neue",Helvetica,"TeX Gyre Heros",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body.transparent{--bg:transparent}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 32px}
  .cap{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);margin-bottom:8px}
  .cap{align-items:center}
  .cap b{font-weight:500;color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px}
  .seg button{all:unset;cursor:pointer;font-size:13px;line-height:1;padding:7px 12px;border-radius:999px;color:var(--ink-2);transition:background-color .2s ease-out,color .2s ease-out}
  .seg button:hover{color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
  .num{font-weight:600;font-variant-numeric:tabular-nums;margin-right:6px}
  .coffee-list button[aria-pressed="true"]{border-top-color:var(--c)}
  .coffee-list button[aria-pressed="true"] .name{color:var(--ink)}
  .cities.coffee-list{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .stage{position:relative;width:100%;aspect-ratio:1/1;touch-action:none;cursor:grab;outline:none}
  .stage.dragging{cursor:grabbing}
  .stage.hot{cursor:pointer}
  .stage:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:50%}
  canvas{display:block;width:100%;height:100%}
  .cities{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin-top:16px}
  .cities button{all:unset;cursor:pointer;padding:12px 8px 12px 0;border-top:2px solid transparent;margin-top:-1px;transition:border-color .2s ease-out}
  .cities button:hover .name{color:var(--blue)}
  .cities button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .cities button[aria-pressed="true"]{border-top-color:var(--blue)}
  .cities button[aria-pressed="true"] .name{color:var(--blue)}
  .name{display:block;font-size:14px;font-weight:500;transition:color .2s ease-out}
  .time{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
  body.no-controls .cities, body.no-controls .seg, body.no-caption .cap b{display:none}
  body.no-caption .cap{justify-content:flex-end}
  body.no-caption.no-controls .cap{display:none}
  @media (max-width:420px){.cities{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap"><b>Coffee exchange</b>
    <div class="seg" role="group" aria-label="Globe view">
      <button type="button" data-mode="cities" aria-pressed="true">Our cities</button>
      <button type="button" data-mode="coffees" aria-pressed="false">Coffees we've tried</button>
    </div>
  </div>
  <div class="stage" id="stage" tabindex="0" role="img" aria-label="Turning globe. Drag or use arrow keys to turn.">
    <canvas id="globe"></canvas>
  </div>
  <div class="cities" id="cities"></div>
</div>

  const BLUE = q.get('color') ? '#' + q.get('color').replace('#','') : '#0000FF';
  const INK = '#14171F', INK2 = '#4E5566';
  const FONT = '"Helvetica Neue",Helvetica,Arial,sans-serif';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RAD = Math.PI/180;

  const CITIES = [
    {id:'cincinnati', name:'Cincinnati', lon:-84.51, lat:39.10, tz:'America/New_York', side:-1, dx:-1.3, dy:1.9},
    {id:'nyc',        name:'New York',   lon:-74.01, lat:40.71, tz:'America/New_York', side: 1},
    {id:'london',     name:'London',     lon: -0.13, lat:51.51, tz:'Europe/London',    side: 1},
    {id:'barcelona',  name:'Barcelona',  lon:  2.17, lat:41.39, tz:'Europe/Madrid',    side: 1},
  ];

  // Coffees: inline copy of data/coffees.json; replaced by the repo file when it can be fetched.
  let COFFEES = [
    {number:'01', name:'Alchemy',   roaster:'Deeper Roots Coffee', colour:'#AE8803', origins:['Brazil','Ethiopia','Guatemala']},
    {number:'02', name:'Companion', roaster:'Little Wolf Coffee',  colour:'#008CFF', origins:['Colombia']},
  ];

  // ---- land dots + country of each dot ----
  const N = GEO.dots.length/2;
  const cLat = new Float32Array(N), sLat = new Float32Array(N), lonR = new Float32Array(N);
  for (let i=0;i<N;i++){ const lo=GEO.dots[2*i]/10*RAD, la=GEO.dots[2*i+1]/10*RAD; lonR[i]=lo; cLat[i]=Math.cos(la); sLat[i]=Math.sin(la); }
  const countryIndex = new Map(GEO.names.map((n,i)=>[n.toLowerCase(), i]));

  // per-country colour (latest coffee wins) and list of coffees, rebuilt when data changes
  let dotGroup = new Int16Array(N), origins = [];   // dotGroup: -1 none, else index into origins
  function indexCoffees(){
    const byCountry = new Map();
    COFFEES.forEach((c,ci) => (c.origins||[]).forEach(o => {
      const k = countryIndex.get(String(o).toLowerCase()); if (k==null) return;
      if (!byCountry.has(k)) byCountry.set(k, {k, name:GEO.names[k], lon:GEO.cents[k][0], lat:GEO.cents[k][1], coffees:[]});
      byCountry.get(k).coffees.push(ci);
    }));
    origins = [...byCountry.values()];
    const lookup = new Map(origins.map((o,i)=>[o.k,i]));
    for (let i=0;i<N;i++){ const g = lookup.get(GEO.cidx[i]); dotGroup[i] = g==null ? -1 : g; }
  }
  indexCoffees();

  // ---- view state ----
  const view = {lon:-40, lat:28};
  const speed = 5;                     // degrees per second
  let resumeAt = 0, anim = null, active = null, activeCoffee = null;
  let mode = 'cities', modeT = 0, modeAnim = null;   // modeT: 0 = cities, 1 = coffees

  function project(lon, lat){
    const l = lon - view.lon*RAD, c0=Math.cos(view.lat*RAD), s0=Math.sin(view.lat*RAD);
    const cl=Math.cos(lat), sl=Math.sin(lat), cL=Math.cos(l), sL=Math.sin(l);
    return [cl*sL, c0*sl - s0*cl*cL, s0*sl + c0*cl*cL];
  }
  const toVec = (lon,lat) => [Math.cos(lat*RAD)*Math.cos(lon*RAD), Math.cos(lat*RAD)*Math.sin(lon*RAD), Math.sin(lat*RAD)];
  function meanLonLat(pts){
    const v=[0,0,0]; pts.forEach(p=>{const u=toVec(p.lon,p.lat); v[0]+=u[0]; v[1]+=u[1]; v[2]+=u[2];});
    const h=Math.hypot(...v)||1; return {lon:Math.atan2(v[1],v[0])/RAD, lat:Math.asin(v[2]/h)/RAD};
  }

  // ---- arcs: the swap ring Cincinnati → NYC → London → Barcelona → Cincinnati ----
  const ARCS = CITIES.map((c,i) => {
    const a = toVec(c.lon,c.lat), d = CITIES[(i+1)%CITIES.length], b = toVec(d.lon,d.lat);
    const om = Math.acos(Math.min(1, a[0]*b[0]+a[1]*b[1]+a[2]*b[2]));
    const steps = Math.max(12, Math.round(om/RAD)), pts=[], lift = 0.02 + om*0.12;
    for (let k=0;k<=steps;k++){
      const t=k/steps, A=Math.sin((1-t)*om)/Math.sin(om), B=Math.sin(t*om)/Math.sin(om);
      const v=[A*a[0]+B*b[0], A*a[1]+B*b[1], A*a[2]+B*b[2]];
      pts.push([Math.atan2(v[1],v[0]), Math.asin(v[2]/Math.hypot(...v)), 1 + lift*Math.sin(Math.PI*t)]);
    }
    return pts;
  });

  // ---- cup icon (24×24 box centred on 0,0) ----
  const cup = new Path2D('M-7 -2 h12 v4 a6 6 0 0 1 -6 6 a6 6 0 0 1 -6 -6 z');
  const handle = new Path2D('M5 0 a3 3 0 0 1 0 6 h-0.8');
  const saucer = new Path2D('M-9 9.5 h16');
  const steam = new Path2D('M-4 -5 c-1.5 -1.5 1.5 -2.5 0 -4.5 M0 -5 c-1.5 -1.5 1.5 -2.5 0 -4.5');

  // ---- canvas ----
  const stage = document.getElementById('stage'), cv = document.getElementById('globe'), ctx = cv.getContext('2d');
  let W=0, H=0, R=0, CX=0, CY=0, dpr=1;
  function resize(){
    const r = stage.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio||1);
    W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr;
    R = Math.min(W,H)/2 - Math.max(24, W*0.07); CX=W/2; CY=H/2 + R*0.02;
  }
  new ResizeObserver(() => { resize(); draw(performance.now()); }).observe(stage);

  const hits = [];
  function halo(text, x, y, fill){
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }

  function draw(now){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const dotR = Math.max(0.9, R/190), t = modeT;
    hits.length = 0;

    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
    ctx.strokeStyle = BLUE; ctx.globalAlpha = .22; ctx.lineWidth = 1; ctx.stroke();

    // land dots. In coffee mode, origin countries take their coffee's colour and the rest fades.
    const c0=Math.cos(view.lat*RAD), s0=Math.sin(view.lat*RAD), L0=view.lon*RAD;
    const back = new Path2D(), front = new Path2D(), groups = origins.map(() => new Path2D());
    for (let i=0;i<N;i++){
      const l=lonR[i]-L0, cL=Math.cos(l);
      const z = s0*sLat[i] + c0*cLat[i]*cL;
      const x = CX + R*cLat[i]*Math.sin(l), y = CY - R*(c0*sLat[i] - s0*cLat[i]*cL);
      if (z>0){
        const g = dotGroup[i], r = dotR*(0.45+0.55*Math.sqrt(z)) * (g>=0 ? 1 + 0.35*t : 1);
        const p = (g>=0 && t>0) ? groups[g] : front;
        p.moveTo(x+r,y); p.arc(x,y,r,0,6.2832);
      } else { back.moveTo(x+dotR*.6,y); back.arc(x,y,dotR*.6,0,6.2832); }
    }
    ctx.fillStyle = BLUE;
    ctx.globalAlpha = .08; ctx.fill(back);
    ctx.globalAlpha = 1 - 0.8*t; ctx.fill(front);
    if (t>0) origins.forEach((o,gi) => {
      const ci = o.coffees[o.coffees.length-1], col = COFFEES[ci].colour;
      const dim = activeCoffee!=null && !o.coffees.includes(activeCoffee) ? 0.3 : 1;
      ctx.fillStyle = BLUE; ctx.globalAlpha = 1-t; ctx.fill(groups[gi]);
      ctx.fillStyle = col;  ctx.globalAlpha = t*dim; ctx.fill(groups[gi]);
    });
    ctx.globalAlpha = 1;

    // ---- cities layer ----
    if (t < 1){
      const a0 = 1 - t;
      ctx.lineWidth = Math.max(1.25, R/220); ctx.lineCap='round';
      ctx.setLineDash([R*0.03, R*0.025]);
      ctx.lineDashOffset = reduce ? 0 : -now*R/9000;
      ctx.strokeStyle = BLUE;
      for (const pts of ARCS){
        ctx.beginPath(); let pen=false;
        for (const [lo,la,h] of pts){
          const [x,y,z]=project(lo,la), sx=CX+R*h*x, sy=CY-R*h*y;
          if (z>0 || (x*x+y*y)*h*h > 1){ pen ? ctx.lineTo(sx,sy) : ctx.moveTo(sx,sy); pen=true; } else pen=false;
        }
        ctx.globalAlpha=.9*a0; ctx.stroke();
      }
      ctx.setLineDash([]);

      const pr = Math.max(13, R*0.055), off = pr*1.9;
      const list = CITIES.map(c => { const [x,y,z]=project(c.lon*RAD,c.lat*RAD); return {c,x:CX+R*x,y:CY-R*y,z}; })
                         .filter(p => p.z > -0.05).sort((a,b)=>a.z-b.z);
      for (const p of list){
        const a = Math.min(1, Math.max(0, (p.z+0.05)/0.3)) * a0;
        const isActive = active === p.c.id, s = isActive ? 1.12 : 1;
        const px=p.x+(p.c.dx||0)*pr, py=p.y-off*s*(p.c.dy||1);
        ctx.globalAlpha = a;
        ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(p.x,p.y,dotR*2.2,0,6.2832); ctx.fill();
        ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(px, py+pr*s); ctx.stroke();
        ctx.beginPath(); ctx.arc(px,py,pr*s,0,6.2832);
        ctx.fillStyle = isActive ? BLUE : '#FFFFFF'; ctx.fill(); ctx.stroke();
        ctx.save(); ctx.translate(px, py+1); const k = pr*s/13; ctx.scale(k,k);
        const fg = isActive ? '#FFFFFF' : BLUE;
        ctx.fillStyle = fg; ctx.strokeStyle = fg; ctx.lineWidth = 1.6; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.fill(cup); ctx.stroke(handle); ctx.stroke(saucer); ctx.lineWidth=1.3; ctx.stroke(steam);
        ctx.restore();
        const fs = Math.max(12, Math.min(15, R/22));
        ctx.font = `500 ${fs}px ${FONT}`; ctx.textBaseline='middle'; ctx.textAlign = p.c.side>0 ? 'left' : 'right';
        halo(p.c.name, px + p.c.side*(pr*s+6), py, INK);
        ctx.globalAlpha=1;
        if (p.z>0.1 && mode==='cities') hits.push({kind:'city', id:p.c.id, x:px, y:py, r:pr*s+4});
      }
    }

    // ---- coffees layer: numbers and country names at each origin ----
    if (t > 0){
      const fs = Math.max(12, Math.min(15, R/22)), nfs = fs*1.35;
      const list = origins.map(o => { const [x,y,z]=project(o.lon*RAD,o.lat*RAD); return {o,x:CX+R*x,y:CY-R*y,z}; })
                          .filter(p => p.z > 0).sort((a,b)=>a.z-b.z);
      for (const p of list){
        const a = Math.min(1, p.z/0.25) * t;
        const dim = activeCoffee!=null && !p.o.coffees.includes(activeCoffee) ? 0.35 : 1;
        ctx.globalAlpha = a*dim;
        ctx.textBaseline='alphabetic'; ctx.textAlign='left';
        // numbers, each in its coffee's colour
        ctx.font = `600 ${nfs}px ${FONT}`;
        let x = p.x - 4, w = 0;
        const nums = p.o.coffees.map(ci => COFFEES[ci]);
        nums.forEach((c,i) => { w += ctx.measureText(c.number).width + (i ? 6 : 0); });
        x = p.x - w/2;
        nums.forEach(c => { halo(c.number, x, p.y, c.colour); x += ctx.measureText(c.number).width + 6; });
        ctx.font = `500 ${fs*0.9}px ${FONT}`; ctx.textAlign='center';
        halo(p.o.name, p.x, p.y + fs*1.25, INK2);
        ctx.globalAlpha = 1;
        if (mode==='coffees' && p.z>0.15) hits.push({kind:'origin', coffee:p.o.coffees[p.o.coffees.length-1], x:p.x, y:p.y, r:Math.max(26, w)});
      }
    }
  }

  // ---- motion ----
  const ease = t => 1-Math.pow(1-t,3);
  let last = performance.now(), dragging = false;
  function tick(now){
    const dt = Math.min(0.05,(now-last)/1000); last=now;
    if (anim){
      const k = Math.min(1,(now-anim.t0)/anim.dur), e=ease(k);
      view.lon = anim.lon0 + (anim.lon1-anim.lon0)*e; view.lat = anim.lat0 + (anim.lat1-anim.lat0)*e;
      if (k>=1){ anim=null; resumeAt = now + 5000; }
    } else if (!dragging && !reduce && now>resumeAt){
      view.lon += speed*dt;
    }
    if (modeAnim){
      const k = Math.min(1,(now-modeAnim.t0)/modeAnim.dur);
      modeT = modeAnim.from + (modeAnim.to-modeAnim.from)*ease(k);
      if (k>=1) modeAnim = null;
    }
    view.lon = ((view.lon+540)%360)-180;
    draw(now);
    requestAnimationFrame(tick);
  }
  function flyTo(lon, lat, dur=1100){
    const d = ((lon - view.lon + 540)%360)-180;
    anim = {t0:performance.now(), dur: reduce?1:dur, lon0:view.lon, lon1:view.lon+d, lat0:view.lat, lat1:lat};
  }

  function goToCity(id){
    const c = CITIES.find(c=>c.id===id); if(!c) return;
    active = id; renderList();
    flyTo(c.lon, Math.max(10, Math.min(45, c.lat - 8)));
  }
  function goToCoffee(ci){
    const c = COFFEES[ci]; if (!c) return;
    activeCoffee = activeCoffee === ci ? null : ci; renderList();
    const pts = origins.filter(o => o.coffees.includes(ci));
    if (activeCoffee!=null && pts.length){ const m = meanLonLat(pts); flyTo(m.lon, Math.max(-35, Math.min(35, m.lat))); }
  }

  // ---- mode toggle ----
  const segButtons = document.querySelectorAll('.seg button');
  function setMode(m, instant){
    if (m!=='cities' && m!=='coffees') return;
    mode = m; active = null; activeCoffee = null;
    segButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
    const to = m==='coffees' ? 1 : 0;
    if (instant || reduce){ modeT = to; modeAnim = null; }
    else modeAnim = {t0:performance.now(), dur:600, from:modeT, to};
    if (m==='coffees' && origins.length){ const c = meanLonLat(origins); flyTo(c.lon, Math.max(-20, Math.min(30, c.lat + 10)), instant?1:1100); }
    else if (m==='cities') flyTo(-40, 28, instant?1:1100);
    try { history.replaceState(null, '', m==='coffees' ? '#coffees' : location.pathname + location.search); } catch(e){}
    renderList();
  }
  segButtons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  addEventListener('hashchange', () => setMode(location.hash==='#coffees' ? 'coffees' : 'cities'));

  // ---- drag / keys / click ----
  let sx=0, sy=0, slon=0, slat=0, moved=0;
  stage.addEventListener('pointerdown', e => {
    dragging=true; moved=0; anim=null; sx=e.clientX; sy=e.clientY; slon=view.lon; slat=view.lat;
    stage.setPointerCapture(e.pointerId); stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    if (dragging){
      const k = 90/R; moved = Math.max(moved, Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy));
      view.lon = slon - (e.clientX-sx)*k;
      view.lat = Math.max(-60, Math.min(70, slat + (e.clientY-sy)*k));
    } else stage.classList.toggle('hot', !!hit(mx,my));
  });
  const end = e => {
    if (!dragging) return; dragging=false; stage.classList.remove('dragging');
    resumeAt = performance.now()+2500;
    if (moved<5){
      const r=stage.getBoundingClientRect(), h=hit(e.clientX-r.left,e.clientY-r.top);
      if (h?.kind==='city') goToCity(h.id); else if (h?.kind==='origin') goToCoffee(h.coffee);
    }
  };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  function hit(x,y){ return hits.slice().reverse().find(p => (x-p.x)**2+(y-p.y)**2 < p.r*p.r); }
  stage.addEventListener('keydown', e => {
    const m = {ArrowLeft:[-10,0], ArrowRight:[10,0], ArrowUp:[0,8], ArrowDown:[0,-8]}[e.key];
    if (!m) return; e.preventDefault();
    anim = {t0:performance.now(), dur:reduce?1:400, lon0:view.lon, lon1:view.lon+m[0], lat0:view.lat, lat1:Math.max(-60,Math.min(70,view.lat+m[1]))};
  });

  // ---- list under the globe: cities with local times, or coffees by number ----
  const box = document.getElementById('cities');
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  function renderList(){
    box.classList.toggle('coffee-list', mode==='coffees');
    if (mode==='cities'){
      box.innerHTML = CITIES.map(c => `<button type="button" data-id="${c.id}" aria-pressed="${active===c.id}">
        <span class="name">${c.name}</span><span class="time" data-tz="${c.tz}"></span></button>`).join('');
      box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => goToCity(b.dataset.id)));
      clock();
    } else {
      box.innerHTML = COFFEES.map((c,i) => `<button type="button" data-i="${i}" aria-pressed="${activeCoffee===i}" style="--c:${esc(c.colour)}">
        <span class="name"><span class="num" style="color:${esc(c.colour)}">${esc(c.number)}</span>${esc(c.name)}</span>
        <span class="time">${esc(c.roaster)}</span></button>`).join('');
      box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => goToCoffee(+b.dataset.i)));
    }
  }
  function clock(){
    box.querySelectorAll('.time[data-tz]').forEach(t => {
      t.textContent = new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:t.dataset.tz}).format(new Date());
    });
  }
  setInterval(clock, 15000);

  // pull the live coffee list from the repo when hosted next to data/ (fails quietly elsewhere)
  if (/github\.io$|^localhost$|^127\./.test(location.hostname)) fetch('../data/coffees.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !Array.isArray(d.coffees) || !d.coffees.length) return;
    COFFEES = d.coffees.map(c => ({number:c.number, name:c.name, roaster:c.roaster, colour:c.colour || BLUE, origins:c.origins || []}));
    indexCoffees(); renderList();
  }).catch(() => {});

  resize();
  setMode(location.hash==='#coffees' || q.get('mode')==='coffees' ? 'coffees' : 'cities', true);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
